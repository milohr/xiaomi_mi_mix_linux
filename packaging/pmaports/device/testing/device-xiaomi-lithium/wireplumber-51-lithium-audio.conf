# Xiaomi Mi MIX (lithium): the ADSP SLIMbus port only starts with 16-bit samples at 48 kHz.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" }, { node.name = "~alsa_input.platform-sound.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
  {
    # Headphones are their own sink (hw:N,1), ranked below the speaker by PCM number.
    # Rank them above it: while unplugged their route is unavailable and the speaker
    # stays the default; plugged in, they take over.
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" } ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver = 1100
      }
    }
  }
]
