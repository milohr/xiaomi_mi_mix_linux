# Xiaomi Mi MIX (lithium): the ADSP SLIMbus port only starts with 16-bit samples at 48 kHz.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" }, { node.name = "~alsa_input.platform-sound.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
]
