# Xiaomi Mi MIX (lithium): decode video on Venus, the hardware decoder (H.264, HEVC,
# VP8, VP9, MPEG-2/4; no AV1). VP9 720p30 takes ~20% CPU this way against ~85% in
# software. Frames are copied back to memory ("-copy"), which works with every output.
hwdec=v4l2m2m-copy

# YouTube through yt-dlp: skip AV1, which Venus cannot decode, and stop at 1080p.
ytdl-format=bestvideo[height<=?1080][vcodec!^=av01]+bestaudio/best[height<=?1080]
