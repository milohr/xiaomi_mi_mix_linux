# Xiaomi Mi MIX (lithium), Adreno 530: Mesa's a5xx binning pass writes its
# visibility streams into fixed 128 KiB buffers without an overflow check
# (fd5_gmem.c: "TODO ... check for overflow"). Busy frames (a browser page with
# video) overflow them, and the GPU writes into whatever buffer follows in the
# shared address space: the status bar showed the browser's video. Rendering
# without the binning pass avoids it; 2D compositing is as fast without it.
FD_MESA_DEBUG=nobin
