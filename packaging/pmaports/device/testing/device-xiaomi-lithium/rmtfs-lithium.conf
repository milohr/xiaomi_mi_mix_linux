# Xiaomi Mi MIX (lithium): never touch the modem partitions. Serve EFS from
# file copies in /var/lib/rmtfs (made once by lithium-rmtfs-setup) instead of
# the packaged "-r -P" (raw partitions).
[Unit]
Requires=lithium-rmtfs-setup.service
After=lithium-rmtfs-setup.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -s -o /var/lib/rmtfs
