# Xiaomi Mi MIX (lithium): WCD9335 on SLIMbus. Playback: MultiMedia1 ->
# SLIMBUS_4_RX -> AIF1_PB -> SLIM RX0/RX1 -> RX INT1/INT2 (HPHL/HPHR).
# The codec gain is fixed at -6 dB; PipeWire controls the volume in software.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_4_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='SLIMBUS_4_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_2 MUX' RX0"
		cset "name='RX INT2_2 MUX' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Digital Volume' 78"
		cset "name='RX1 Digital Volume' 78"
	]

	DisableSequence [
		cset "name='RX0 Digital Volume' 0"
		cset "name='RX1 Digital Volume' 0"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}
