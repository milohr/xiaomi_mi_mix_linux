# Xiaomi Mi MIX (lithium) playback through the ADSP:
#   Speaker:    MultiMedia1 (hw:N,0) -> QUATERNARY_MI2S_RX -> TFA9891 (bypass mode, full gain)
#   Headphones: MultiMedia2 (hw:N,1) -> SLIMBUS_4_RX -> WCD9335 AIF1_PB -> RX0/RX1 -> HPHL/HPHR
# Each output has its own DSP stream, so both are sinks of the one HiFi profile and a
# jack event only changes which sink is preferred; nothing is reopened. The DSP routes
# are connected for the whole verb: a front end opens only with a back end routed.
# The headset jack (kernel patch 0017) marks Headphones available while plugged; they
# then win over the speaker, which takes over again on unplug.
# Codec gain is fixed; PipeWire controls the volume in software.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIMBUS_4_RX Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_4_RX Audio Mixer MultiMedia2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_2 MUX' RX0"
		cset "name='RX INT2_2 MUX' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Digital Volume' 78"
		cset "name='RX1 Digital Volume' 78"
	]

	DisableSequence [
		cset "name='RX0 Digital Volume' 0"
		cset "name='RX1 Digital Volume' 0"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
}
